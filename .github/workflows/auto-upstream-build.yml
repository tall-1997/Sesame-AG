name: Auto Build Upstream
run-name: Auto Build Upstream - ${{ github.actor || 'schedule' }}

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

env:
  UPSTREAM_REPO: Sesame-AG/Sesame-AG
  CI: "true"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"

concurrency:
  group: auto-upstream-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      latest_tag: ${{ steps.fetch.outputs.latest_tag }}
      latest_commit: ${{ steps.fetch.outputs.latest_commit }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Fetch latest upstream tag
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api_url="https://api.github.com/repos/${UPSTREAM_REPO}/tags?per_page=1&page=1"
          response=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_url")
          latest_tag=$(echo "$response" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['name'] if data else '')")
          latest_commit=$(echo "$response" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data[0]['commit']['sha'] if data else '')")

          if [[ -z "$latest_tag" || -z "$latest_commit" ]]; then
            echo "Failed to resolve latest upstream tag from ${UPSTREAM_REPO}" >&2
            exit 1
          fi

          echo "latest_tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "latest_commit=$latest_commit" >> "$GITHUB_OUTPUT"
          echo "Latest upstream tag: $latest_tag ($latest_commit)"

      - name: Check if already built
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.fetch.outputs.latest_tag }}"
          build_tag="${tag}-build"
          if gh release view "$build_tag" --repo "${{ github.repository }}" &>/dev/null; then
            echo "Release $build_tag already exists, skipping"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $build_tag not found, will build"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout upstream tag
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.check.outputs.latest_tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "zulu"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Required Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          gradle-version: wrapper

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:+UseG1GC" \
            --no-parallel

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          release_dir="app/build/outputs/apk/release"
          staging_dir="/tmp/apks"
          mkdir -p "$staging_dir"

          if [[ ! -d "$release_dir" ]]; then
            echo "Release output directory not found: $release_dir" >&2
            exit 1
          fi

          find "$release_dir" -maxdepth 1 -name "*.apk" -exec cp {} "$staging_dir/" \;

          echo "Found APKs:"
          ls -la "$staging_dir"/
          count=$(find "$staging_dir" -maxdepth 1 -name "*.apk" | wc -l)
          if [[ "$count" -eq 0 ]]; then
            echo "No APKs found under $release_dir" >&2
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "staging_dir=$staging_dir" >> "$GITHUB_OUTPUT"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sesame-TK-${{ needs.check.outputs.latest_tag }}
          path: ${{ steps.collect.outputs.staging_dir }}
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.check.outputs.latest_tag }}"
          commit="${{ needs.check.outputs.latest_commit }}"
          short_commit="${commit:0:7}"
          build_tag="${tag}-build"
          default_branch="${{ github.event.repository.default_branch }}"

          shopt -s nullglob
          apk_files=(${{ steps.collect.outputs.staging_dir }}/*.apk)
          if [[ ${#apk_files[@]} -eq 0 ]]; then
            echo "No APK files to publish" >&2
            exit 1
          fi

          gh release create "$build_tag" \
            "${apk_files[@]}" \
            --repo "${{ github.repository }}" \
            --target "$default_branch" \
            --title "Sesame-TK ${tag} (自动构建)" \
            --notes "## Sesame-TK ${tag} 自动构建

          基于上游 [${UPSTREAM_REPO}](https://github.com/${UPSTREAM_REPO}) tag \`${tag}\` (commit \`${short_commit}\`) 自动构建。

          **架构说明**：
          - \`*-arm64-v8a-*.apk\` - 64位 ARM 设备
          - \`*-armeabi-v7a-*.apk\` - 32位 ARM 设备
          - \`*-x86_64-*.apk\` - 64位 x86（模拟器）
          - \`*-x86-*.apk\` - 32位 x86（模拟器）
          - \`*-universal-*.apk\` / 其他 - 通用版

          **注意**：此为自动构建版本，非官方发布。使用前请阅读 [LEGAL.md](https://github.com/${UPSTREAM_REPO}/blob/main/LEGAL.md)。"
